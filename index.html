<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Happy New Year Side Burst Animation</title>
  <meta name="viewport" content="width=1000, user-scalable=no">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css?family=Montserrat:700');

    *,
    *:after,
    *:before {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 100ms ease-in;
    }

    html, body {
      background: #222048; 
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* ---- VIP START SCREEN CSS ---- */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #59a5a3 0%, #1f4241 100%); 
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      transition: background 0.7s ease, opacity 0.5s ease;
    }

    #start-btn-overlay {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 26px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      padding: 18px 50px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: pulseGlow 2s infinite; 
    }

    #start-btn-overlay:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.8);
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.4);
      animation: none; 
    }

    #start-btn-overlay:active {
      transform: scale(0.95);
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4), 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
      70% { box-shadow: 0 0 0 25px rgba(255, 255, 255, 0), 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
      100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0), 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    }

    /* --- NAYA ANIMATION CONTAINER (Overlapping Fix) --- */
    #animation-container {
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease-in-out;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    body.start-anim #animation-container {
      opacity: 1;
      pointer-events: auto;
    }

    /* Creator Tag (Hamesha Top Par) */
    .creator-tag {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      color: rgba(255, 255, 255, 0.7);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      text-decoration: none;
      z-index: 4000; 
      transition: color 0.3s ease, opacity 0.3s ease;
    }
    .creator-tag:hover {
      color: rgb(255, 255, 255);
      opacity: 1;
    }

    /* Volume Toggle (Hamesha Top Par) */
    #volume-checkbox { display: none; }
    .volume-label {
      height: 44px; width: 44px;
      position: fixed; bottom: 1rem; right: 1rem;
      cursor: pointer; z-index: 4000;
    }
    .volume-label svg {
      position: absolute; height: 100%; width: 100%;
      top: 0; left: 0; fill: #ffffff; opacity: 0.8;
    }
    .volume-label:hover svg { opacity: 1; }
    .volume-label svg:nth-of-type(1) { display: none; }
    #volume-checkbox:checked ~ .volume-label svg:nth-of-type(1) { display: block; }
    #volume-checkbox:checked ~ .volume-label svg:nth-of-type(2) { display: none; }

    /* Confetti Canvas */
    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      pointer-events: none;
    }

    .feliz {
      width: 100%;
      font-family: cursive;
      font-size: 100px;
      font-weight: 700;
      color: #f48fb1;
      text-align: center;
      position: absolute;
      top: 50%;
      opacity: 0;
      z-index: 10;
    }

    .ano_novo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 200px 100px 0px 0px;
      z-index: 10;
    }

    .ano_novo>span {
      font-family: 'Montserrat', sans-serif;
      font-size: 175px;
      font-weight: 700;
      color: #7a8fe8;
    }

    span.num { margin-right: 50px; }
    span.seis {
      position: absolute; top: 50%; right: 50%; margin-right: -200px;
    }
    span.sete {
      position: absolute; right: 0%; margin-right: -200px;
    }

    span.sete:before {
      content: ''; width: 0px; height: 4px; display: block;
      border-radius: 3px; background: #7a8fe8;
      transform: rotate(0deg); transform-origin: left top;
      position: absolute; top: 55px; left: 30px; z-index: -1;
    }

    .balao {
      width: 100px; height: 100px; display: block;
      background: #e8d57a; border-radius: 50%;
      position: absolute; top: 50%; margin-top: -165px;
      right: 0%; margin-right: -200px;
    }

    .balao:before {
      content: ''; width: 0; height: 0; border-style: solid;
      border-width: 0 10px 20px 10px; border-color: transparent transparent #b19b32 transparent;
      position: absolute; left: 50%; margin-left: -10px; bottom: -10px; z-index: -1;
    }

    .balao:after {
      content: ''; width: 4px; height: 100px; display: block;
      background: #fff; border-radius: 0px 0px 3px 3px;
      position: absolute; left: 50%; margin-left: -2px; bottom: -110px;
    }

    /* --- YE CLASSES ANIMATION KO CLICK KE BAAD SHURU KARENGI --- */
    body.start-anim .feliz {
      -webkit-animation: vem_feliz 2s ease-in-out 7s forwards;
      animation: vem_feliz 2s ease-in-out 7s forwards;
    }
    body.start-anim span.seis {
      -webkit-animation: vai_2016 5s ease-in-out 5s forwards;
      animation: vai_2016 5s ease-in-out 5s forwards;
    }
    body.start-anim span.sete {
      -webkit-animation: vem_2017 6s ease-in-out forwards;
      animation: vem_2017 6s ease-in-out forwards;
    }
    
    /* YAHAN SE DISPLAY: NONE HATA DIYA HAI */
    body.start-anim span.sete:before {
      -webkit-animation: entrega_balao 1s ease-in-out 4s;
      animation: entrega_balao 1s ease-in-out 4s;
    }
    
    body.start-anim .balao {
      -webkit-animation: vem_e_vai_balao 10s ease-in-out forwards;
      animation: vem_e_vai_balao 10s ease-in-out forwards;
    }

    @-webkit-keyframes vem_2017 {
      0% { right: 0%; }
      66.6666% { right: 50%; margin-right: -300px; }
      90% { right: 50%; margin-right: -300px; }
      100% { right: 50%; }
    }
    @keyframes vem_2017 {
      0% { right: 0%; }
      66.6666% { right: 50%; margin-right: -300px; }
      90% { right: 50%; margin-right: -300px; }
      100% { right: 50%; }
    }

    @-webkit-keyframes vem_e_vai_balao {
      0% { right: 0%; }
      40% { right: 50%; margin-right: -300px; }
      50% { right: 50%; margin-right: -200px; top: 50%; }
      100% { top: -100%; right: 50%; }
    }
    @keyframes vem_e_vai_balao {
      0% { right: 0%; }
      40% { right: 50%; margin-right: -300px; }
      50% { right: 50%; margin-right: -200px; top: 50%; }
      100% { top: -100%; right: 50%; }
    }

    @-webkit-keyframes entrega_balao {
      0% { transform: rotate(-30deg); width: 40px; }
      100% { transform: rotate(-150deg); width: 35px; }
    }
    @keyframes entrega_balao {
      0% { transform: rotate(-30deg); width: 40px; }
      100% { transform: rotate(-150deg); width: 35px; }
    }

    @-webkit-keyframes vai_2016 {
      0% { top: 50%; }
      100% { top: -100%; }
    }
    @keyframes vai_2016 {
      0% { top: 50%; }
      100% { top: -100%; }
    }

    @-webkit-keyframes vem_feliz {
      0% { margin-top: 0px; opacity: 0; }
      100% { margin-top: -200px; opacity: 1; }
    }
    @keyframes vem_feliz {
      0% { margin-top: 0px; opacity: 0; }
      100% { margin-top: -200px; opacity: 1; }
    }
  </style>
</head>

<body>
  <!-- YEH DONO OPTIONS AB SABSE BAHAR HAIN (Z-Index 4000) TAAKI HAMESHA DIKHEIN -->
  <a href="https://www.instagram.com/herosalman1_929/" target="_blank" class="creator-tag">
    Made by : @Herosalman1
  </a>

  <input id="volume-checkbox" type="checkbox" checked/>
  <label for="volume-checkbox" title="Toggle sound" class="volume-label">
    <svg viewBox="0 0 24 24"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z"></path></svg>
    <svg viewBox="0 0 24 24"><path d="M12,4L9.91,6.09L12,8.18M4.27,3L3,4.27L7.73,9H3V15H7L12,20V13.27L16.25,17.53C15.58,18.04 14.83,18.46 14,18.7V20.77C15.38,20.45 16.63,19.82 17.68,18.96L19.73,21L21,19.73L12,10.73M19,12C19,12.94 18.8,13.82 18.46,14.64L19.97,16.15C20.62,14.91 21,13.5 21,12C21,7.72 18,4.14 14,3.23V5.29C16.89,6.15 19,8.83 19,12M16.5,12C16.5,10.23 15.5,8.71 14,7.97V10.18L16.45,12.63C16.5,12.43 16.5,12.21 16.5,12Z"></path></svg>
  </label>

  <!-- Start Screen Overlay -->
  <div id="start-screen">
    <button id="start-btn-overlay">🎉 CLICK HERE 😁👆</button>
  </div>

  <!-- Background Audio -->
  <audio id="bgMusic" loop>
    <source src="https://res.cloudinary.com/qvbwofki/video/upload/v1787254234/ytmp3free.cc_hookah-bar-khiladi-786-full-song-hd-youtubemp3free.org.mp3" type="audio/mp3">
  </audio>

  <!-- Yeh Container start screen hatne ke baad hi show hoga -->
  <div id="animation-container">
      
      <!-- Confetti Canvas Background -->
      <canvas id="confetti-canvas"></canvas>

      <div class="feliz">Happy New Year</div>
      <div class="ano_novo">
        <span class="num">202</span>
        <span class="seis">5</span>
        <span class="sete">6</span>
        <div class="balao"></div>
      </div>
  </div>

  <!-- JavaScript -->
  <script>
    const startBtnOverlay = document.getElementById('start-btn-overlay');
    const startScreen = document.getElementById('start-screen');
    const bgAudio = document.getElementById('bgMusic');
    const volumeCheckbox = document.getElementById('volume-checkbox');

    startBtnOverlay.addEventListener('click', () => {
      bgAudio.muted = !volumeCheckbox.checked;
      bgAudio.play().catch(e => console.log('Audio Blocked:', e));

      startBtnOverlay.style.opacity = '0';
      startScreen.style.background = '#000000'; 
      
      setTimeout(() => {
        startScreen.style.opacity = '0';
        
        setTimeout(() => {
          startScreen.style.display = 'none';
          document.body.classList.add('start-anim');
          
          setTimeout(() => {
            createBurst(); 
            setInterval(createBurst, 2000); 
          }, 9500); 
        }, 500); 
      }, 700); 
    });

    volumeCheckbox.addEventListener('change', (e) => {
      bgAudio.muted = !e.target.checked;
    });

    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let confetti = [];
    const colors = ['#f48fb1', '#7a8fe8', '#e8d57a', '#f5cc06', '#ffffff', '#ff6b6b', '#48dbfb', '#1dd1a1'];

    function createBurst() {
        const particleCount = 150; 

        for (let i = 0; i < particleCount; i++) {
            confetti.push({
                x: 0,
                y: canvas.height * 0.8,
                w: Math.random() * 10 + 5,
                h: Math.random() * 5 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                vx: Math.random() * 20 + 5,
                vy: -(Math.random() * 25 + 10),
                rot: Math.random() * 360,
                rotSpeed: Math.random() * 10 - 5
            });
        }

        for (let i = 0; i < particleCount; i++) {
            confetti.push({
                x: canvas.width,
                y: canvas.height * 0.8,
                w: Math.random() * 10 + 5,
                h: Math.random() * 5 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                vx: -(Math.random() * 20 + 5),
                vy: -(Math.random() * 25 + 10),
                rot: Math.random() * 360,
                rotSpeed: Math.random() * 10 - 5
            });
        }
    }

    function renderConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < confetti.length; i++) {
            let c = confetti[i];
            ctx.save();
            ctx.translate(c.x + c.w/2, c.y + c.h/2);
            ctx.rotate(c.rot * Math.PI / 180);
            ctx.fillStyle = c.color;
            ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
            ctx.restore();

            c.y += c.vy;
            c.x += c.vx;
            c.rot += c.rotSpeed;
            
            c.vy += 0.4; 
            c.vx *= 0.99; 
        }

        confetti = confetti.filter(c => c.y < canvas.height + 100);
        requestAnimationFrame(renderConfetti);
    }
    
    renderConfetti();

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
